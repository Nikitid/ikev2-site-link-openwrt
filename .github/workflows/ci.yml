name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Package identity
        run: ./scripts/check-version-sync.sh
      - name: Shell, fixture and staging checks
        run: ./scripts/check.sh
      - name: Publisher key
        run: |
          . ./apk-feed.env
          actual="$(sha256sum "$OPENWRT_APK_KEY_FILE" | awk '{ print $1 }')"
          [ "$actual" = "$OPENWRT_APK_TRUST_SHA256" ] || {
            echo "publisher key checksum mismatch: $actual" >&2
            exit 1
          }
          openssl pkey -pubin -in "$OPENWRT_APK_KEY_FILE" -noout
          if grep -rlE 'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY' keys; then
            echo 'private key material is tracked' >&2
            exit 1
          fi
